name: Rust Clippy Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Run clippy checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev

      - name: Run clippy with default features
        run: cargo clippy -- -D warnings
      
      - name: Run clippy with all features
        run: cargo clippy --all-features -- -D warnings
        
      - name: Check for possible improvements
        run: |
          # Store clippy suggestions in a file
          cargo clippy --all-features --message-format=json | jq -r 'select(.reason == "compiler-message") | select(.message.level == "warning") | .message.rendered' > clippy-warnings.txt
          
          # Output the warnings
          if [ -s clippy-warnings.txt ]; then
            echo "Clippy found some suggestions for code improvements:"
            cat clippy-warnings.txt
            echo "These are not blocking but should be addressed in future PRs."
          else
            echo "No clippy warnings found! 🎉"
          fi