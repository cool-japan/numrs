# Platform-specific build configuration
# NumRS2 uses OxiBLAS (pure Rust BLAS/LAPACK) - no system BLAS dependencies required

# Note: Previous configuration used system OpenBLAS, but this has been removed
# per COOLJAPAN Pure Rust Policy. All BLAS/LAPACK operations now go through
# scirs2-linalg which uses OxiBLAS internally.

# Development environment variables
[env]
# Pure Rust - no external BLAS required

# ===================================================================
# PERFORMANCE OPTIMIZATION BUILD FLAGS
# ===================================================================
# 2026-08-19: Removed the per-target `-C target-feature=+avx2,+fma` (x86_64)
# and `+neon` (aarch64) rustflags that used to live here.
#
# Why: the crate already does CPU-feature detection at *runtime* (see
# src/simd_optimize/feature_detect.rs and friends, which call
# `std::is_x86_feature_detected!("avx2" | "fma" | ...)` and dispatch
# accordingly) rather than gating any code behind
# `#[cfg(target_feature = "avx2")]`. Baking `+avx2,+fma` into every local
# build made the codegen assume AVX2/FMA are always present, which:
#   1. silently diverges from what `cargo build`/`cargo install` produces for
#      end users on stock target definitions (they don't get these flags),
#      making "works here" not mean "works for users" on older x86_64 CPUs; and
#   2. would abort with SIGILL on any pre-Haswell (pre-2013) x86_64 CPU that
#      lands on a codegen path the compiler was allowed to widen to AVX2/FMA.
# `+neon` on aarch64 was removed too, for consistency — NEON is part of the
# aarch64 baseline (every aarch64-apple-darwin / standard aarch64-unknown-linux-gnu
# target already has it on by default), so the flag was a no-op restated here.
#
# If you need max local throughput for benchmarking on your own machine, use
# `RUSTFLAGS="-C target-cpu=native" cargo build --release` instead (see the
# note at the bottom of this file) — that opts a single local build in
# without changing what ships to users.

# WebAssembly target configuration
[target.wasm32-unknown-unknown]
rustflags = [
    "--cfg", "getrandom_backend=\"wasm_js\"",  # Enable getrandom for WASM (required for v0.3.x)
]

# Note: For maximum performance on your specific CPU, you can use:
# RUSTFLAGS="-C target-cpu=native" cargo build --release
# However, this produces non-portable binaries. The settings above are
# portable to most modern x86_64 (2013+) and ARM64 systems.
