# ===================================================================
# FEATURE-GATED INTEGRATION TESTS
# ===================================================================
# tests/gpu_integration.rs wires the previously-orphaned tests/gpu/{test_gpu_ops,
# test_gpu_linalg,test_gpu_memory}.rs (never `mod`-included by any harness, so
# never compiled) into an actual cargo test target. `required-features` makes
# cargo skip building it entirely under default features, rather than compiling
# a stub that immediately hits `numrs2::gpu` symbols that don't exist without
# the `gpu` feature.
[[test]]
name = "gpu_integration"
required-features = ["gpu"]

# tests/io_integration.rs wires the previously-orphaned tests/io/{test_bson,
# test_matlab,test_messagepack,test_netcdf}.rs (never `mod`-included by any
# harness, so never compiled since 0.2.0) into an actual cargo test target.
# required-features lists the four format features directly (rather than the
# broader `io-all`, which also drags in `arrow`/`parquet`) so `cargo nextest
# run --features bson,matlab,messagepack,netcdf` builds exactly this target;
# `--features io-all` is a superset and also satisfies it.
[[test]]
name = "io_integration"
required-features = ["bson", "matlab", "messagepack", "netcdf"]

# tests/parallel_integration.rs wires the previously-orphaned tests/parallel/
# (mod.rs + 12 test files, never `mod`-included by any harness, so never
# compiled since 0.2.0) into an actual cargo test target. numrs2::parallel is
# always compiled (not feature-gated), so this target needs no
# required-features -- it builds and runs under default features like any
# other tests/*.rs integration test.
[[test]]
name = "parallel_integration"

[patch.crates-io]
# Pure-Rust replacement for alloca (criterion dep) — no C/VLA, no linker errors on aarch64-apple-darwin
# NOTE (2026-08-19 manifest audit): re-verified this is still required. criterion
# 0.8.2's own published Cargo.toml has
# `[target."cfg(any(windows, unix))".dependencies.alloca] version = "0.4"`,
# and `cargo tree -i alloca --all-features` on this workspace resolves
# alloca -> criterion 0.8.2 -> numrs2 (dev-dependency) right now. Do not remove
# this patch (or patches/alloca/) while criterion 0.8.2 is pinned in
# [dev-dependencies] — doing so reintroduces the real C-backed `alloca` crate
# on every windows/unix target, including this machine (aarch64-apple-darwin).
alloca = { path = "patches/alloca" }

