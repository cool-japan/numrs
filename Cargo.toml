[package]
name = "numrs2"
version = "0.1.0-alpha.5"
edition = "2021"
authors = ["cool-japan/NumRS2 (KitaSan) Team"]
description = "A Rust implementation inspired by NumPy for numerical computing (NumRS2)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cool-japan/numrs"
readme = "README.md"
keywords = ["numpy", "numerical", "array", "linear-algebra", "mathematics"]
categories = ["science"]

[features]
default = ["matrix_decomp"]
matrix_decomp = []
validation = []
unstable = []
fast = []  # Minimal feature set for fast compilation during development
scirs = ["dep:scirs2-stats", "dep:scirs2-core", "dep:scirs2-linalg"]
gpu = ["dep:wgpu", "dep:bytemuck", "dep:futures-intrusive", "dep:tokio"]
lapack = ["dep:ndarray-linalg", "dep:blas", "dep:lapack"]  # Enable LAPACK-dependent linear algebra operations
ci-safe = ["matrix_decomp", "validation"]  # Safe features for CI without external dependencies

[dependencies]
ndarray = "0.16.1"  # Provides n-dimensional arrays
ndarray-linalg = { version = "0.17.0", optional = true }  # Linear algebra with BLAS/LAPACK
blas = { version = "0.23.0", optional = true }  # BLAS bindings
lapack = { version = "0.20.0", optional = true }  # LAPACK bindings
num-traits = "0.2.19"  # Numeric traits for generic math
num-complex = "0.4.6"  # Complex number implementation
# Type conversions are handled by num-traits::NumCast
rand = "0.9.0"      # Random number generation
rand_distr = "0.5.0"  # Additional random distributions
rayon = "1.10.0"     # Parallel computation
simba = "0.9.0"     # SIMD abstraction
paste = "1.0.15"    # For macro development
thiserror = "2.0.12"  # Error handling
lazy_static = "1.4.0" # For static initialization patterns
serde = { version = "1.0.197", features = ["derive"] }  # Serialization/deserialization
serde_json = "1.0.114"  # JSON support
csv = "1.3.0"       # CSV file format support
bincode = "1.3.3"   # Binary serialization support
byteorder = "1.5.0"  # For NPY format byte order handling
zip = "0.6.6"       # For NPZ file format support (zipped NPY files)
serde-pickle = "1.1.1"  # Python pickle format support
nalgebra = "0.32.3" # Linear algebra library for interoperability
memmap2 = "0.9.1"   # Memory-mapped file I/O
num_cpus = "1.16.0"
regex = "1.10.2"    # Regular expressions for string operations

# Optional SciRS2 dependencies
scirs2-stats = { version = "0.1.0-alpha.6", optional = true }
scirs2-core = { version = "0.1.0-alpha.6", optional = true }
scirs2-linalg = { version = "0.1.0-alpha.6", optional = true }

# Optional GPU acceleration dependencies
wgpu = { version = "0.19.1", optional = true }
bytemuck = { version = "1.15.0", features = ["derive"], optional = true }
futures-intrusive = { version = "0.5.0", optional = true }
tokio = { version = "1.36.0", features = ["sync", "rt"], optional = true }

# Note: polars dependency has been removed to improve build speed

[dev-dependencies]
criterion = "0.5.1"  # Benchmarking library
approx = "0.5.1"     # Approximate floating-point comparisons for tests
tempfile = "3.8.1"   # Temporary files for testing I/O functionality
# For performance benchmarks in bench.rs
serde_json = "1.0.114"  # For loading NumPy benchmark results

[[bench]]
name = "numpy_comparison"
path = "bench/bench.rs"
harness = true

[[bench]]
name = "bench_distributions"
path = "bench/bench_distributions.rs"
harness = false

[[bench]]
name = "numpy_comparison_benchmark"
harness = false

[[bench]]
name = "core_operations_benchmark"
harness = false
